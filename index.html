<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070c" />
    <title>BREAKNECK</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #06070c;
        touch-action: none;
        overscroll-behavior: none;
        /* No text selection or long-press callouts when steering by touch. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        /* Full-bleed: the renderer centres the shaft and fills the rest with
           the exterior, so there is never a letterbox to look at. */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
